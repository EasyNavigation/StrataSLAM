# PAL Tiago without its LiDAR: head RGB-D camera (Orbbec on head_2_link; the head did not move in pasillo_Tiago) for
# the tracking, wheel odometry as its prior and the base IMU's gravity for its roll and pitch (the IMU is mounted upside
# down and its TF does not say so: the mounting is learned from the motion, ADR-0044).
# The depth image is registered to the colour camera, whose camera_info carries K (the depth one has NaN).
strataslam:
  version: 1
robot:
  platform: ground
  base_frame: base_footprint
  odom_frame: odom
  map_frame: map
sensors:
  camera:
    enabled: true
    rgb_topic: /head_front_camera/rgb/image_raw
    depth_topic: /head_front_camera/depth/image_raw
    info_topic: /head_front_camera/rgb/camera_info
    depth_min: 0.4
    depth_max: 6.0
    features: orb
    max_features: 1000
  imu:
    enabled: true
    topic: /base_imu
    floor_changes: false  # gravity only (roll and pitch of the camera tracking): the base vibrates (ADR-0032)
  external_odometry:
    enabled: true
    frame: odom  # the wheel odometry, in TF as odom -> base_footprint: predicts each frame and carries losses
multifloor:
  mode: planar  # floors: a map per level | single: one map, heights kept | planar: one flat map (ground robots)
  floor_height_prior: null  # the spacing of the floors is not known: no height prior between them
fusion:
  odometry_from: camera  # the camera tracks the motion; the wheels and the IMU support it
  colorize_cloud: true
  vocabulary: default  # the one shipped (TUM RGB-D offices). In pasillo_Tiago the camera never sees a place again
  #   facing the same way: few loops even so (docs/user/troubleshooting.md)
output:
  map_dir: ~/strataslam_maps/tiago_camera_only_{date}_{time}
  voxel_size: 0.05
runtime:
  threads: 1
