# Ground robot with a planar laser scanner (2D LiDAR, odometry: x, y and heading), an RGB-D camera (loop closures,
# verified and refined by the scans, the 3D of the map, its depth placed by the scan's poses, and its colours; an
# Intel RealSense D435i here) and the robot's IMU (gravity). One level: a planar scan sees no height (ADR-0066,
# ADR-0068). A template: every option of a profile is here,
# active when this example uses it, commented with its default otherwise. Reference: docs/user/profiles.md.
strataslam:
  version: 1

robot:
  platform: ground  # handheld | ground | aerial
  base_frame: base_link
  odom_frame: odom
  map_frame: map

sensors:
  # A sensor section that is present is enabled unless it says `enabled: false`; an absent one is off.
  camera:
    enabled: true
    # RealSense D435i with realsense2_camera 4.x, launched with the aligned depth on:
    #   ros2 launch realsense2_camera rs_launch.py camera_namespace:=/ align_depth.enable:=true
    # (the driver's defaults put the topics under /camera/camera/ and leave the aligned depth off). For another RGB-D
    # camera, give its colour image, its depth registered to the colour image and the colour camera_info.
    rgb_topic: /camera/color/image_raw
    depth_topic: /camera/aligned_depth_to_color/image_raw  # depth registered to the colour image
    info_topic: /camera/color/camera_info
    depth_min: 0.3  # m
    depth_max: 6.0  # m
    features: orb  # orb (xfeat is not built in this version)
    max_features: 1000
  lidar:
    enabled: true
    topic: /scan  # sensor_msgs/LaserScan with type 2d (sensor_msgs/PointCloud2 with 3d)
    type: 2d  # 3d | 2d (a planar scanner mounted level: registered in its plane, ground robots only)
    min_range: 0.1  # m
    max_range: 10.0  # m
    deskew: auto  # auto | true | false (auto: when the scan gives the time between its rays)
  imu:
    enabled: true
    topic: /imu  # sensor_msgs/Imu, the robot's; its mounting comes from the TF or is learned from the motion
    floor_changes: false  # gravity only: a ground robot's base vibrates, and its vertical acceleration does not
    # accel_bias: auto  # the accelerometer's offset: auto (measured against the floors a LiDAR sees and applied, ADR-0074) | false | [x, y, z] m/s^2 in the IMU frame (ADR-0072)
    #   detect elevators reliably yet (ADR-0032)
    noise:  # nominal values (also the defaults); measure your IMU with `strataslam imu-noise`
      accel_noise_density: 2.0e-3  # m/s^2/sqrt(Hz)
      gyro_noise_density: 1.7e-4  # rad/s/sqrt(Hz)
      accel_random_walk: 3.0e-3  # m/s^3/sqrt(Hz)
      gyro_random_walk: 2.0e-5  # rad/s^2/sqrt(Hz)
  barometer:
    enabled: false
    # topic: /pressure  # sensor_msgs/FluidPressure
    # reference_topic: /pressure_base  # a fixed base station: differential altitude, weather cancelled
    # temperature_k: 288.15
    # settle_time_s: 2.0  # low-pass filter settling time
  external_odometry:
    enabled: false
    # Give a topic or a frame, not both. With a LiDAR it is used with prior: true (ADR-0071): it predicts each scan,
    # carries the pose through a loss (an elevator cabin) and vetoes the slide of a degraded registration.
    # topic: /odom  # nav_msgs/Odometry
    # frame: odom  # or the TF frame -> robot.base_frame
    # prior: true  # auto (the camera tracking's prior only) | true | false

fusion:
  odometry_from: auto  # auto | camera | lidar (auto: the LiDAR if enabled, else the camera)
  loop_closure_from: auto  # auto | camera | lidar | both. Auto with a camera and a LiDAR: the camera proposes, the
  #   scans verify and refine
  colorize_cloud: true
  colorize_views: 0  # the camera's depth carries its own colours: the images around add none to a planar
  #   scanner's map (slam_test: 97.1 % coloured either way), and with 0 no keyframe image is kept (231 MB instead
  #   of 343). With a 3D LiDAR they colour what the camera missed: see ground_lidar_camera_imu.yaml
  # colorize_image_scale: 1.0  # scale of the keyframes' images kept for that: 0.5 takes a quarter of the memory
  vocabulary: default  # camera loop closures: `default` is the one shipped (TUM RGB-D offices); your own:
  #   `strataslam vocab train`, then its path (relative to this file)

multifloor:
  mode: planar  # floors: a map per level | single: one map, heights kept | planar: one flat map (ground robots)
  floor_height_prior: null  # the spacing of the floors is not known: no height prior between them
  # split_on_tracking_loss: true
  # tracking_loss_timeout: 2.0  # s
  # min_vertical_change: 1.5  # m

output:
  # map_dir: ~/strataslam_maps/{date}_{time}
  # voxel_size: 0.05  # m
  # keyframe_translation: 0.25  # m
  # keyframe_rotation_deg: 10.0
  # publish_tf: true  # map -> floor_<k> -> odom (REP-105); false when another node owns map -> odom (a
  #   localizer such as AMCL): then only floor_<k> -> strataslam_odom

runtime:
  # seed: 42
  # threads: 0  # 0: automatic; 1: bit-exact runs
