name: nightly benchmarks

on:
  schedule:
    - cron: "17 3 * * *"  # off the hour: GitHub drops scheduled runs at peak load
  workflow_dispatch:

jobs:
  part:
    # Every published result regenerated with scripts/make_results.sh: scenarios on seed 42 and on seeds
    # 1001-1020, camera-noise study, TUM fr1/fr2, KITTI, benchmarks. Split into parts that run
    # side by side: in one job the whole took 2.6-4.5 h on a normal runner and went past the 6 h a job may run on a
    # slow one (the same build took 15 min instead of 3). The scenario groups balance their run times.
    name: results (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: other, steps: "1,4,5,6", scenarios: ""}
          - {part: s01-s06, steps: "2,3", scenarios: "S01,S02,S03,S05,S06"}
          - {part: s07-s14, steps: "2,3", scenarios: "S07,S08,S09,S10,S12,S13,S14"}
          - {part: s11-s16, steps: "2,3", scenarios: "S11,S16"}
          - {part: s15-s17, steps: "2,3", scenarios: "S15,S17"}
    steps:
      - uses: actions/checkout@v5
      - run: scripts/install_deps.sh core && sudo apt-get install -y --no-install-recommends unzip
      - run: cmake -S superbuild -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j 2  # memory: see ci.yml
      - if: matrix.part == 'other'
        run: scripts/download_datasets.sh data
      - run: scripts/make_results.sh build data results 4
        env:
          STRATASLAM_RESULTS_STEPS: ${{ matrix.steps }}
          STRATASLAM_RESULTS_SCENARIOS: ${{ matrix.scenarios }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-${{ matrix.part }}
          # The KITTI ground truth (CC BY-NC-SA 3.0, derived from its OXTS data) is not redistributed.
          path: |
            results
            !results/kitti_0027*.gt.tum

  results:
    # The parts joined (make_results.sh with no step: the runs of the scenario groups summarized together), the
    # pages written and the regression gates applied, also when a part failed (its results are then missing).
    needs: part
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: results/parts
      - run: scripts/make_results.sh build data results
        env:
          STRATASLAM_RESULTS_STEPS: none
      # Regression gate of the multi-seed acceptance (ADR-0035): no scenario may pass on fewer seeds than
      # the baseline recorded in docs/seeds_baseline.json.
      - run: |
          python3 - <<'PY'
          import json, sys
          base = json.load(open("docs/seeds_baseline.json")); now = json.load(open("results/seeds_baseline.json"))
          worse = [f"{s}: {now.get(s, 0):.0%} < {r:.0%}" for s, r in base.items() if now.get(s, 0) + 1e-9 < r]
          print("\n".join(worse) or "no scenario below its baseline"); sys.exit(1 if worse else 0)
          PY
      # Real data: an ATE more than 10 % above docs/real_data_baseline.json is a regression (spec 12.6).
      - run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          base = json.load(open("docs/real_data_baseline.json"))
          now = {Path(r["sequence"]).name: r["ate_rmse"] for r in map(json.loads, open("results/tum.jsonl")) }
          now["kitti_2011_09_30_drive_0027"] = json.load(open("results/kitti.json"))["ate_rmse_m"]
          worse = [f"{k}: {now.get(k, float('inf')):.4f} > 1.1 x {v:.4f}" for k, v in base.items() if not now.get(k, float("inf")) <= 1.1 * v]
          print("\n".join(worse) or "real-data ATE within 10 % of the baseline"); sys.exit(1 if worse else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results
          path: |
            results
            !results/parts
