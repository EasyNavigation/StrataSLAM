name: build & test

on:
  push:
  pull_request:

jobs:
  # Each job has a time limit about three times what it takes, so a hung download or test fails it within the hour
  # instead of after GitHub's six.
  core:
    # Core + simulator without ROS, installed exactly as docs/user/install.md says: unit tests and the
    # integration scenarios S01..S14 (seed 42).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: scripts/install_deps.sh core
      - run: cmake -S superbuild -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j 2  # two jobs: a GTSAM translation unit takes over 1 GB; -j alone ran the 16 GB runner out of memory
      - run: ctest --test-dir build --output-on-failure -j2
        env:
          STRATASLAM_REPORT_DIR: ${{ github.workspace }}/scenario-reports
      # Every shared library the core loads must be registered in THIRD_PARTY.md (spec 3.2).
      - run: python3 scripts/license_audit.py --ldd build/strataslam_core/libstrataslam_core.so build/strataslam_core/strataslam_tum_run build/strataslam_core/strataslam_kitti_run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-reports
          path: scenario-reports
      - uses: actions/upload-artifact@v4
        with:
          name: core-binaries
          path: |
            build/strataslam_core/libstrataslam_core.so
            build/strataslam_sim/libstrataslam_sim.so
            build/strataslam_core/strataslam_write_sample_clouds
            build/strataslam_core/strataslam_eval_tool
            build/strataslam_sim/strataslam_fusion_ablation
            build/strataslam_sim/strataslam_scenario_runner

  coverage:
    # >= 85 % in geometry, backend/factors, floors and config; >= 65 % overall (spec 12.9).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: scripts/install_deps.sh core && sudo apt-get install -y --no-install-recommends gcovr
      - run: cmake -S strataslam_core -B build -DCMAKE_BUILD_TYPE=Debug -DSTRATASLAM_ENABLE_COVERAGE=ON
      - run: cmake --build build -j 2  # two jobs: a GTSAM translation unit takes over 1 GB; -j alone ran the 16 GB runner out of memory
      - run: ctest --test-dir build --output-on-failure -j2
      - run: python3 scripts/check_coverage.py build strataslam_core
      # The same lines for Codecov (the README badge), with paths relative to the repository. The gate is the step
      # above; an upload that fails (no CODECOV_TOKEN secret yet, Codecov down) does not fail the job.
      - run: >-
          gcovr -r . --object-directory build --cobertura coverage.xml
          --exclude '.*/test/.*' --exclude '.*/tools/.*' --exclude '.*_deps/.*' --exclude '/usr/.*' --exclude '/opt/.*'
      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          disable_search: true  # only coverage.xml: its own search and gcov run picked up every system header
          plugins: noop
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  sanitizers:
    # On every push too (audit AUD-018: only pull requests ran it, so a direct push skipped it).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: scripts/install_deps.sh core
      - run: cmake -S strataslam_core -B build -DCMAKE_BUILD_TYPE=Debug -DSTRATASLAM_ENABLE_SANITIZERS=ON
      - run: cmake --build build -j 2  # two jobs: a GTSAM translation unit takes over 1 GB; -j alone ran the 16 GB runner out of memory
      # Two tests at a time, as in the coverage job: the system tests (a building walked through, an IMU turned on a
      # floor for 100 s) take minutes each under ASan, and in series they no longer fit the 45 minutes.
      - run: ctest --test-dir build --output-on-failure -j2

  ros2-jazzy:
    # The full install guide in a ROS 2 Jazzy container: the repository cloned into src/ of a workspace,
    # colcon build of the five packages, the CLI on PATH, colcon test. One package at a time, two compile jobs
    # each (memory, as in the core job).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: ros:jazzy
    env:
      MAKEFLAGS: -j2
    steps:
      - uses: actions/checkout@v5
        with:
          path: src/StrataSLAM
      - run: src/StrataSLAM/scripts/install_deps.sh ros
      - shell: bash
        run: source /opt/ros/jazzy/setup.bash && colcon build --executor sequential --cmake-args -DCMAKE_BUILD_TYPE=Release && test "$(ls install | grep -c ^strataslam)" -eq 5
      - shell: bash
        run: source /opt/ros/jazzy/setup.bash && source install/setup.bash && strataslam --help && colcon test --event-handlers console_direct+ && colcon test-result --verbose

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The libraries the downloaded binaries load, and those Open3D's wheel loads (EGL, GL, OpenMP, libusb) for the
      # cloud tests: `core` downloaded 241 MB of -dev packages, which a slow mirror held past the job's 30 minutes.
      - run: |
          scripts/install_deps.sh runtime
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            libegl1 libgl1 libgomp1 libusb-1.0-0
      - uses: actions/download-artifact@v4
        with:
          name: core-binaries
          path: bin
      # upload-artifact keeps the paths below their common folder (build/): strataslam_core/..., strataslam_sim/...
      - run: find bin -mindepth 2 -type f -exec mv -t bin {} + && chmod +x bin/*
      # numpy as in ROS 2 Jazzy (Ubuntu 24.04), the platform the tools run on: the pinned mypy cannot read the stubs
      # of numpy 2.x, so an unpinned install failed the type check on code that had not changed.
      # The extra `viewer` brings Rerun as it works with numpy 1.x, for the live view's tests.
      - run: pip install -e "strataslam_tools[dev,viewer]" "numpy==1.26.4"
      - run: ruff check .
      # mypy reads its configuration from strataslam_tools/pyproject.toml, so it runs from there.
      - run: mypy strataslam_tools
        working-directory: strataslam_tools
      # The suite takes seconds: a hang fails here, with faulthandler's stacks, not at the job's limit.
      - run: pytest strataslam_tools/tests
        timeout-minutes: 10
        env:
          STRATASLAM_TEST_STRICT: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/bin
          STRATASLAM_SAMPLE_BIN: ${{ github.workspace }}/bin/strataslam_write_sample_clouds
          STRATASLAM_EVAL_BIN: ${{ github.workspace }}/bin/strataslam_eval_tool

  lint-cpp:
    # clang-tidy with the checks of .clang-tidy (zero warnings) on the core.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - run: scripts/install_deps.sh core && sudo apt-get install -y --no-install-recommends clang-tidy libomp-dev
      - run: cmake -S superbuild -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: run-clang-tidy -p build -quiet 'strataslam_core/src/.*\.cpp$'

  format-cpp:
    # Every C++ file as .clang-format says (ADR-0055); clang-format 18, pinned: another version formats differently.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format-18
      - run: git ls-files -z '*.cpp' '*.hpp' | xargs -0 clang-format-18 --dry-run --Werror

  license-audit:
    # Build files against THIRD_PARTY.md (the linked libraries are checked in the core job).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/license_audit.py

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_links.py
